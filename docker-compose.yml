services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: tug-tracker-rabbitmq
    ports:
      - "5672:5672"    # AMQP port
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
      RABBITMQ_DISK_FREE_LIMIT: 1GB
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - tug-tracker-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  port-operations-simulator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tug-tracker-simulator
    environment:
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
      SIMULATION_INTERVAL: 1000
      VESSEL_SPAWN_INTERVAL: 20000
      POSITION_UPDATE_INTERVAL: 3000
      ASSISTANCE_DURATION: 5000
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - tug-tracker-network
    restart: unless-stopped

  port-operations-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: tug-tracker-api
    ports:
      - "3000:3000"
    environment:
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
      PORT: 3000
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - tug-tracker-network
    restart: unless-stopped

  port-operations-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: tug-tracker-frontend
    ports:
      - "8080:80"
    depends_on:
      - port-operations-api
    networks:
      - tug-tracker-network
    restart: unless-stopped

volumes:
  rabbitmq_data:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=5GB

networks:
  tug-tracker-network:
    driver: bridge
